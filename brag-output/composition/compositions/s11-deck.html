 rgba(10,26,26,.06)"><div style="position:absolute;left:14px;top:12px;font-size:14px;font-weight:700">Plan and Prioritize</div><div style="position:absolute;left:14px;top:44px;font-size:11px;color:#3A4645">• Write tomorrow's top three tasks the night before</div><div style="position:absolute;left:14px;top:66px;font-size:11px;color:#3A4645">• Use the Eisenhower matrix: urgent vs. important</div><div style="position:absolute;left:14px;top:88px;font-size:11px;color:#3A4645">• Block focused time on your calendar</div></div><div style="position:absolute;left:14px;top:174px;width:308px;font-size:13px;line-height:1.45"><b>2.</b> Explain how to plan and prioritize using the Eisenhower matrix and daily task lists.</div></div><div id="s11-dk-kp2" class="wcard" style="left:904px;top:470px;width:336px;height:262px;opacity:0"><div style="position:absolute;left:14px;top:12px;width:308px;height:150px;border-radius:10px;background:#FBF8F1;border:1px solid rgba(10,26,26,.06)"><div style="position:absolute;left:14px;top:12px;font-size:14px;font-weight:700">Protect Your Focus</div><div style="position:absolute;left:14px;top:44px;font-size:11px;color:#3A4645">• Silence notifications during deep work</div><div style="position:absolute;left:14px;top:66px;font-size:11px;color:#3A4645">• Work in 25-minute sprints with short breaks</div><div style="position:absolute;left:14px;top:88px;font-size:11px;color:#3A4645">• Review your week every Friday</div></div><div style="position:absolute;left:14px;top:174px;width:308px;font-size:13px;line-height:1.45"><b>3.</b> Demonstrate how to protect focus through time-blocking and short work sprints.</div></div></div></div></div></div>
