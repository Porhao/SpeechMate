# SpeechMate — full stack: Postgres + FastAPI backend + Next.js frontend
# (+ optional local AI servers: Ollama LLM, profile "ollama"; Kokoro TTS, profile "tts").
#   ./start.sh            (or: docker compose up --build -d; add --profile ollama for the local LLM)
# Frontend: http://localhost:3000 · API: http://localhost:8000 (docs at /docs)
name: speechmate

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: speechmate
      POSTGRES_PASSWORD: speechmate_password
      POSTGRES_DB: speechmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speechmate -d speechmate_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # Local models for live-session analysis (~2 GB). INSTALL_ML=false ./start.sh for a slim image.
        INSTALL_ML: ${INSTALL_ML:-true}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Always use the compose database and the persistent storage volume
      - DATABASE_URL=postgresql+asyncpg://speechmate:speechmate_password@db/speechmate_db
      - STORAGE_BASE_PATH=/app/storage
      - CORS_ORIGINS=["http://localhost:3000"]
      # Demo accounts for local testing (see TESTING.md). Set to false for a real deployment.
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # Downloaded model weights (Whisper, Wav2Vec2, …) survive rebuilds
      - HF_HOME=/models/huggingface
      - XDG_CACHE_HOME=/models
    volumes:
      - storage_data:/app/storage
      - model_cache:/models
    ports:
      - "8000:8000"
    # Lets LLM_BASE_URL=http://host.docker.internal:11434/v1 reach an Ollama running on your own machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional local LLM (docker compose --profile ollama …; ./start.sh does this
  # automatically when backend/.env has LLM_BASE_URL=http://ollama:11434/v1) ──
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      # Keep only one model in memory at a time (text or vision), unloading it after 5 idle minutes
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU (much faster than CPU): uncomment, and install the NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Optional natural-sounding local TTS for the live AI partner (Kokoro-82M, Apache-2.0;
  # ./start.sh starts it when backend/.env has TTS_BASE_URL=http://kokoro:8880/v1) ──
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["tts"]
    ports:
      - "8880:8880"
    restart: unless-stopped

  # One-shot: downloads the LLM_MODEL / VLM_MODEL named in backend/.env (skips ones already present)
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in "$$LLM_MODEL" "$$VLM_MODEL"; do
          case "$$m" in ""|gpt-*) continue ;; esac
          echo "Pulling $$m…" && ollama pull "$$m"
        done
    depends_on:
      - ollama
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  model_cache:
  ollama_models:
